                </button>

<script>
        // Simple logic for the sheet micro-interactions
        const sheet = document.getElementById('student-profile-sheet');
        let isClosing = false;

        document.querySelector('button:has(.material-symbols-outlined:contains("close"))')?.addEventListener('click', () => {
            sheet.style.transform = 'translateY(100%)';
        });

        // Search for the Cancel button by text and add click listener
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
            if (btn.innerText === 'Cancel') {
                btn.addEventListener('click', () => {
                    sheet.style.transform = 'translateY(100%)';
                });
            }
        });

        // Drag handle feedback (Visual only for this demo)
        const handle = sheet.querySelector('.rounded-full.mb-4');
        handle.addEventListener('mousedown', () => {
            sheet.classList.add('cursor-grabbing');
        });
        window.addEventListener('mouseup', () => {
            sheet.classList.remove('cursor-grabbing');
        });
    </script>
