<body class="bg-surface-dim flex items-end justify-center min-h-screen">
<!-- Backdrop Dimmer Overlay -->
<div class="fixed inset-0 bg-on-surface/40 z-40 backdrop-blur-sm"></div>
<!-- Bottom Sheet Modal -->
<div class="bottom-sheet relative z-50 w-full max-w-md bg-surface rounded-t-lg shadow-2xl flex flex-col max-h-[839px] overflow-hidden">
<!-- Drag Handle Indicator -->
<div class="flex justify-center py-sm shrink-0">
<div class="drag-handle"></div>
</div>
<!-- Top App Bar (From Shared Components JSON) -->
<header class="flex items-center h-header-height px-md bg-surface border-b border-outline shrink-0 fixed top-0 w-full z-50 relative">
<div class="flex-1 flex items-center">
<h1 class="font-headline-md text-headline-md text-primary truncate">Edit Staff Profile</h1>
</div>
<button aria-label="Close" class="touch-target flex items-center justify-center hover:bg-surface-container-high transition-colors duration-200 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant">close</span>
</button>
</header>
<!-- Body Content (Scrollable) -->
<div class="flex-1 overflow-y-auto px-lg pb-xl pt-md space-y-xl">
<!-- Header Section: Avatar -->
<div class="flex flex-col items-center">
<div class="relative w-24 h-24 mb-md">
<div class="w-full h-full rounded-full border-2 border-outline overflow-hidden bg-surface-container-low">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a friendly male teacher in his early 40s wearing a crisp button-down shirt. The background is a soft, out-of-focus academic library with clean indigo and white color tones. The lighting is soft and even, highlighting a trustworthy and professional demeanor suitable for an institutional staff profile." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDFOn3TSZdcJEhbc4xID4bZVkqzPVZd7zR0KmW42YKa1v0gE07y8LlKe85UvWVahOsT8xiPB_3dZ4HMgk9vfcD_QzRp-MFuFqVr_OS2Ky8VfEkYICfyf2GHXrhUkZ4BniEqBU3NTVdpIER9wWUQjkaEZJcqyeIkMXqLQIll0dWXfn-Z7Mh5QGBbcGnGyOD0URGeAa1VIkirdtpE35F3hzUfREC91XHMZoSPYOjt9rvUuUBRFe8AZLyQAOdDE194BpRqdMrFFbOgtw"/>
</div>
<button class="absolute bottom-0 right-0 w-8 h-8 bg-primary rounded-full flex items-center justify-center border-2 border-surface shadow-md">
<span class="material-symbols-outlined text-on-primary text-[18px]" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
<div class="bg-surface-container px-md py-xs rounded-full">
<span class="font-label-md text-on-surface-variant">STF-0142</span>
</div>
</div>
<!-- Update Documents Section -->
<section class="space-y-md">
<h2 class="font-label-sm text-label-sm text-on-surface-variant tracking-wider">UPDATE DOCUMENTS</h2>
<!-- Drop Zone -->
<div class="border-2 border-dashed border-outline rounded-lg p-lg bg-surface-container-low flex flex-col items-center text-center space-y-sm hover:border-primary transition-colors cursor-pointer group">
<span class="material-symbols-outlined text-primary text-3xl group-hover:scale-110 transition-transform">cloud_upload</span>
<p class="font-body-md text-on-surface-variant text-sm">
                        Click to upload or <span class="text-primary font-semibold">drag and drop</span><br/>
<span class="text-[11px] opacity-70">PDF, JPG or PNG, max 5MB</span>
</p>
</div>
<!-- File List -->
<div class="space-y-sm">
<!-- Row 1 -->
<div class="flex items-center p-sm bg-surface border border-outline rounded-lg group">
<div class="w-10 h-10 bg-error-container/30 rounded flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-error" style="font-variation-settings: 'FILL' 1;">picture_as_pdf</span>
</div>
<div class="ml-md flex-1">
<p class="font-label-md text-on-surface">Certificate.pdf</p>
<p class="text-[10px] text-on-surface-variant uppercase">1.2 MB</p>
</div>
<button class="touch-target flex items-center justify-center hover:bg-error-container/20 rounded-full transition-colors text-error">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
<!-- Row 2 -->
<div class="flex items-center p-sm bg-surface border border-outline rounded-lg group">
<div class="w-10 h-10 bg-secondary-container/20 rounded flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">image</span>
</div>
<div class="ml-md flex-1">
<p class="font-label-md text-on-surface">ID_Card.jpg</p>
<p class="text-[10px] text-on-surface-variant uppercase">850 KB</p>
</div>
<button class="touch-target flex items-center justify-center hover:bg-error-container/20 rounded-full transition-colors text-error">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>
</section>
<!-- Personal Details Section -->
<section class="space-y-md">
<h2 class="font-label-sm text-label-sm text-on-surface-variant tracking-wider">PERSONAL DETAILS</h2>
<div class="space-y-md">
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant">First Name</label>
<input class="w-full h-11 px-md border border-outline rounded focus:ring-1 focus:ring-primary focus:border-primary bg-surface font-body-md" type="text" value="Alexander"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant">Last Name</label>
<input class="w-full h-11 px-md border border-outline rounded focus:ring-1 focus:ring-primary focus:border-primary bg-surface font-body-md" type="text" value="Sterling"/>
</div>
</div>
</section>
<!-- Employment Section -->
<section class="space-y-md">
<h2 class="font-label-sm text-label-sm text-on-surface-variant tracking-wider">EMPLOYMENT</h2>
<div class="space-y-md">
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant">Role Category</label>
<div class="relative">
<select class="w-full h-11 px-md border border-outline rounded focus:ring-1 focus:ring-primary focus:border-primary bg-surface font-body-md appearance-none">
<option selected="">Teaching</option>
<option>Administration</option>
<option>Management</option>
<option>Support Staff</option>
</select>
<div class="absolute right-md top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">keyboard_arrow_down</span>
</div>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant">Role Title</label>
<input class="w-full h-11 px-md border border-outline rounded focus:ring-1 focus:ring-primary focus:border-primary bg-surface font-body-md" type="text" value="Mathematics Teacher"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant">Phone Number</label>
<input class="w-full h-11 px-md border border-outline rounded focus:ring-1 focus:ring-primary focus:border-primary bg-surface font-body-md" type="tel" value="+1 (555) 012-3456"/>
</div>
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant">Email Address</label>
<input class="w-full h-11 px-md border border-outline rounded focus:ring-1 focus:ring-primary focus:border-primary bg-surface font-body-md" type="email" value="a.sterling@scholarsphere.edu"/>
</div>
</div>
</section>
<!-- Institutional Notes Section -->
<section class="space-y-md">
<h2 class="font-label-sm text-label-sm text-on-surface-variant tracking-wider">INSTITUTIONAL NOTES</h2>
<div class="space-y-xs">
<textarea class="w-full p-md border border-outline rounded focus:ring-1 focus:ring-primary focus:border-primary bg-surface font-body-md resize-none" placeholder="Enter administrative notes here..." rows="4">Senior educator with focus on Advanced Calculus. Leading the curriculum redesign for Academic Year 24/25.</textarea>
<p class="text-[11px] text-on-surface-variant italic">Notes visible to administrators only.</p>
</div>
</section>
</div>
<!-- Sticky Footer -->
<footer class="p-lg bg-surface border-t border-outline flex flex-col gap-md shrink-0">
<button class="w-full h-[44px] border border-primary text-primary font-label-md rounded hover:bg-primary-container/10 transition-colors">
                Cancel
            </button>
<button class="w-full h-[44px] bg-[#5B50F5] text-white font-label-md rounded shadow-sm active:scale-[0.98] transition-transform">
                Save Changes
            </button>
</footer>
</div>
<!-- Bottom Navigation (Hidden on Mobile Sheets usually, but logic kept for reference) -->
<!-- The prompt focuses on the Bottom Sheet as the primary UI, suppressing global nav for focus. -->
<script>
        // Micro-interaction for the file delete buttons
        document.querySelectorAll('button.text-error').forEach(btn => {
            btn.addEventListener('click', function() {
                const row = this.closest('.group');
                row.style.opacity = '0.5';
                row.style.pointerEvents = 'none';
                setTimeout(() => {
                    row.remove();
                }, 300);
            });
        });

        // Basic form validation feedback placeholder
        const saveBtn = document.querySelector('button.bg-\\[\\#5B50F5\\]');
        saveBtn.addEventListener('click', () => {
            saveBtn.innerHTML = '<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Saving...</span>';
            setTimeout(() => {
                saveBtn.innerHTML = 'Save Changes';
                alert('Profile updated successfully!');
            }, 1500);
        });
    </script>
