services:
  # ── Backend API — point Render at this service ─────────────────────────────
  - type: web
    name: scholarsphere-api
    runtime: node
    rootDir: .
    buildCommand: npm install --prefix backend && npm run build --prefix backend
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false          # e.g. https://your-app.vercel.app
