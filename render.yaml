services:
  # ── Backend API — point Render at this service ─────────────────────────────
  - type: web
    name: scholarsphere-api
    runtime: node
    rootDir: .               # repo root (backend/ is a subfolder)
    buildCommand: npm install && cd backend && npm install && npm run build
    startCommand: node backend/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false          # set in Render dashboard
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false          # e.g. https://your-app.vercel.app

  # ── Frontend (Next.js) — optional if not using Vercel ──────────────────────
